<title>인바디 미스터리</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1ea">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#f4f5ef; --bg2:#e2e9de; --card:#fbfaf5; --card2:#f4f1e8; --line:#e4dfd1; --ink:#1f2b26; --muted:#5f6b64; --soft:#8a948d;
  --green:#2f6f5e; --green-d:#22574a; --green-l:#e4efe8; --sage:#b7cdb2; --warm:#e9c46a; --coral:#d98468; --bad:#c2452f; --warn:#a86a10;
  --shadow:0 10px 30px rgba(52,70,58,.10), 0 1px 2px rgba(52,70,58,.06);
  --kr:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; --en:"Outfit","Noto Sans KR",sans-serif;
  --fz:1; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(1400px 900px at 50% 42%, var(--bg1), var(--bg2));color:var(--ink);font:400 calc(16px*var(--fz))/1.6 var(--kr);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid rgba(225,219,203,.7);border-radius:22px;box-shadow:var(--shadow)}
.eyebrow{font:600 calc(12px*var(--fz))/1.2 var(--en);letter-spacing:.22em;color:var(--green);text-transform:uppercase;margin:0 0 8px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.small{font-size:calc(14px*var(--fz));color:var(--muted)}
.btn{border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:700;font-size:calc(17px*var(--fz));min-height:52px;padding:0 24px;box-shadow:0 4px 0 var(--green-d);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn[href]{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:0 3px 0 #dcd6c6}
.btn.sm{min-height:42px;font-size:calc(15px*var(--fz));padding:0 16px}
.btn:focus-visible,.tool:focus-visible,.hs:focus-visible,.opt:focus-visible{outline:3px solid #7fae9a;outline-offset:2px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#brand{position:absolute;left:max(24px,env(safe-area-inset-left));top:calc(var(--safeT) + 20px);display:flex;gap:14px;align-items:center;padding:16px 22px 16px 16px}
#brand i{width:46px;height:46px;border-radius:13px;background:var(--green);display:grid;place-items:center;color:#fff;font:600 calc(30px*var(--fz))/1 var(--en);font-style:normal}
#brand b{display:block;font-size:calc(20px*var(--fz));font-weight:800}
#brand small{display:block;font:500 calc(11.5px*var(--fz))/1.2 var(--en);letter-spacing:.22em;color:var(--muted);margin-top:4px}
#chap{position:absolute;left:max(24px,env(safe-area-inset-left));top:calc(var(--safeT) + 112px);width:330px;padding:22px 26px;transition:opacity .4s, transform .4s}
#chap h2{font-size:calc(24px*var(--fz))}
#chap p.d{margin:10px 0 0;color:var(--muted);font-size:calc(15px*var(--fz))}
#chap.min{opacity:.0;transform:translateX(-12px);pointer-events:none;visibility:hidden}
#tools{position:absolute;right:max(20px,env(safe-area-inset-right));top:calc(var(--safeT) + 20px);display:flex;gap:10px}
.tool{border:1px solid rgba(225,219,203,.7);background:var(--card);border-radius:16px;min-height:52px;min-width:52px;padding:0 18px;display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:var(--shadow);font-weight:500;font-size:calc(16px*var(--fz))}
.tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8}
.tool[aria-pressed="true"]{background:var(--green-l);border-color:#bcd6c8}
.tool .n{background:var(--green);color:#fff;border-radius:999px;font-size:calc(12px*var(--fz));padding:0 7px;min-width:20px;text-align:center}
#keys{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:calc(var(--safeB) + 18px);display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;font-size:calc(14px*var(--fz));color:var(--muted)}
kbd{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 0 var(--line);font:600 calc(13px*var(--fz)) var(--en);color:var(--ink);padding:0 6px}
#keys span{margin:0 8px 0 2px}
#pill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safeB) + 14px);padding:10px 26px;border-radius:999px;background:var(--card);border:1px solid rgba(225,219,203,.7);box-shadow:var(--shadow);font-size:calc(15px*var(--fz));color:var(--ink);white-space:nowrap}
#keyChip{position:absolute;right:max(20px,env(safe-area-inset-right));top:calc(var(--safeT) + 86px);padding:10px 14px;border-radius:16px;display:flex;gap:8px;align-items:center;font-size:calc(14px*var(--fz));font-weight:700}
#keyChip i{width:22px;height:22px;border-radius:7px;background:#e9e4d6;display:inline-block;border:1px solid #dcd5c3}
#keyChip i.on{background:var(--warm);border-color:#d7b04d;box-shadow:0 0 0 3px #f6e7bb}

/* 조사 지점 */
#hs{position:fixed;inset:0;pointer-events:none;z-index:4}
.hs{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;transform:translate(-50%,-50%);transition:opacity .2s}
.hs .c{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(40,60,50,.16), 0 0 0 1px rgba(0,0,0,.03);transition:transform .2s}
.hs .c svg{width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:2.4}
.hs .l{background:#fff;border-radius:10px;padding:5px 12px;font-size:calc(14px*var(--fz));font-weight:700;box-shadow:0 4px 14px rgba(40,60,50,.12);white-space:nowrap}
.hs.main .c{background:var(--green)} .hs.main .c svg{stroke:#fff}
.hs.main .c::after{content:"";position:absolute;width:46px;height:46px;border-radius:50%;border:2px solid var(--green);animation:ping 1.8s infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.hs.done .c{background:#e9f2ec} .hs.done .c svg{stroke:#5f9e86}
.hs.near .c{transform:scale(1.12)}
.hs .e{display:none;font:600 calc(11px*var(--fz)) var(--en);background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.hs.near .e{display:inline-block}
.hs.lock .c svg{stroke:#9aa29c}

/* 대화창 */
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safeB) + 70px);width:min(980px, calc(100% - 32px));z-index:8;padding:22px 26px;display:grid;grid-template-columns:92px 1fr auto;gap:22px;align-items:center;max-height:min(66vh, 620px);overflow:hidden}
#dlg.wide{grid-template-columns:92px 1fr;align-items:start}
#dlg.wide #dlgFoot{grid-column:1 / -1;justify-content:flex-end}
#dlg .body{min-width:0;max-height:calc(min(66vh,620px) - 44px);overflow:auto;overscroll-behavior:contain}
#dlg.wide .body{max-height:calc(min(66vh,620px) - 120px)}
#dlgPic{width:92px;height:92px;border-radius:50%;background:#e4ece4;object-fit:cover;align-self:start}
#dlgWho{display:block;color:var(--green);font-weight:700;font-size:calc(16px*var(--fz));margin-bottom:4px}
#dlgTitle{font-size:calc(20px*var(--fz));margin:2px 0 6px}
#dlgTitle:empty{display:none}
#dlgText{margin:0;font-size:calc(18px*var(--fz));line-height:1.65}
#dlgFoot{display:flex;gap:10px;flex-wrap:wrap}
#dlgOpts{display:grid;gap:10px;margin-top:14px}
#dlgOpts:empty{display:none}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:calc(16px*var(--fz));line-height:1.5;transition:border-color .15s, background .15s}
.opt:hover{border-color:#9cc3b1;background:#f6faf7}
.opt.no{border-color:#e6b3a6;background:#fcf1ee;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sign{margin:12px 0 4px;padding:14px 16px;border-radius:14px;background:#2f4858;color:#fff;font-weight:500;font-size:calc(16px*var(--fz))}
.blank{display:inline-block;min-width:56px;text-align:center;border-bottom:2px dashed #f2c14e;color:#f2c14e;font-weight:800;margin:0 4px}
.ans{display:flex;gap:8px;margin-top:12px}
.ans{max-width:100%}
.ans .btn{flex:0 0 auto}
.ans input{flex:1 1 0;width:0;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:calc(17px*var(--fz));background:#fff}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pick button{border:1.5px solid var(--line);background:#fff;border-radius:12px;min-width:48px;padding:8px 14px;font-weight:700;font-size:calc(16px*var(--fz))}
.pick button:hover{border-color:#9cc3b1;background:#f6faf7}
.howto{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.howto span{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:600;font-size:calc(14.5px*var(--fz))}
.howto i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#f1f3f2;display:grid;place-items:center;flex:none}
.camp{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--green-l);font-size:calc(15px*var(--fz))}
.camp b{color:var(--green);margin-right:6px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.refs>span{font-size:calc(13px*var(--fz));color:var(--muted);margin-right:2px}
.ref{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:calc(12.5px*var(--fz));color:var(--ink)}
.ref:hover{border-color:#9cc3b1}
.tagI{display:inline-block;font-size:calc(12px*var(--fz));font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:2px 10px;margin-bottom:6px}

/* 시트 */
#sheet{position:fixed;inset:0;z-index:12;display:grid;place-items:center;padding:16px;background:rgba(40,56,48,.18);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#sheet[hidden]{display:none}
.panel{width:min(620px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:28px 30px;position:relative}
.panel.wide{width:min(760px,100%)}
.panel h2{font-size:calc(26px*var(--fz));margin-bottom:8px}
.panel h3{font-size:calc(18px*var(--fz));margin:20px 0 8px}
.x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:12px;border:0;background:var(--card2);font-size:calc(20px*var(--fz))}
.box{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;margin:12px 0}
.box summary{cursor:pointer;font-weight:700}
.box ul,.facts{margin:6px 0 0;padding-left:20px}
.facts li{margin:4px 0}
.note{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:calc(15px*var(--fz));margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.row .btn{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-weight:500}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--green)}
table.req{width:100%;border-collapse:collapse;font-size:calc(14px*var(--fz));margin-top:8px}
table.req th{text-align:left;color:var(--green);width:58px;vertical-align:top;padding:5px 0}
table.req td{padding:5px 0}
.steps{display:flex;gap:6px;margin:0 0 14px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--green)}
.upload{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:2px dashed #c8d8cc;border-radius:18px;padding:16px 18px;background:#f7faf6;cursor:pointer;margin:10px 0}
.upload input{display:none}
.upload b{font-size:calc(17px*var(--fz))}
.upload .pick{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:calc(15px*var(--fz))}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
#preview{max-width:100%;max-height:180px;border-radius:12px;margin-top:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1 / -1}
.field .l{font-size:calc(14px*var(--fz));font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.unitwrap{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:0 12px}
.unitwrap input{flex:1;min-width:0;width:0;border:0;outline:0;background:none;font:inherit;font-size:calc(17px*var(--fz));padding:11px 0}
.unitwrap em{font-style:normal;color:var(--muted);font-size:calc(14px*var(--fz))}
.unitwrap.bad{border-color:var(--bad)} .unitwrap.warn{border-color:#e0a63a}
select{border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:calc(16px*var(--fz));padding:11px 12px}
.msg{font-size:calc(13px*var(--fz));color:var(--bad);min-height:0}
.msg.w{color:var(--warn)}
.badge{font-size:calc(11.5px*var(--fz));font-weight:700;border-radius:999px;padding:1px 8px;background:var(--green-l);color:var(--green)}
.badge.w{background:#fbefd6;color:var(--warn)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:none;padding:10px 6px;font-size:calc(15px*var(--fz));font-weight:500}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}
.npc{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:16px;padding:10px 14px;margin:6px 0 12px}
.npc img{width:52px;height:52px;border-radius:50%;background:#e4ece4}
.npc b{color:var(--green);display:block;font-size:calc(14px*var(--fz))}
.npc span{font-size:calc(15px*var(--fz))}
.ex{display:inline-block;background:#fbefd6;color:var(--warn);font-weight:700;border-radius:999px;padding:2px 10px;font-size:calc(13px*var(--fz))}

/* 결과 */
.type{font-size:calc(28px*var(--fz));font-weight:800;color:var(--green);margin:4px 0}
.axis{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;background:#fff}
.axis .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.axis .name{font-weight:800;font-size:calc(17px*var(--fz))}
.axis .bia{font-size:calc(13px*var(--fz));color:var(--muted)}
.axis .q{margin:6px 0;font-weight:500}
.axis .pct{font-weight:800;color:var(--green);font-size:calc(20px*var(--fz));margin-left:4px}
.iconarr{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:8px 0;max-width:420px}
.iconarr i{aspect-ratio:1;border-radius:50%;background:#e5e1d5}
.iconarr i.on{background:var(--green)}
.iconarr i.avg{box-shadow:0 0 0 2px var(--warm)}
.trust{border-radius:16px;background:#f1f5f2;padding:14px 16px;margin:14px 0}
.trust dl{display:grid;grid-template-columns:80px 1fr;gap:6px 10px;margin:8px 0 0;font-size:calc(14.5px*var(--fz))}
.trust dt{font-weight:700;color:var(--green)}
.trust dd{margin:0}
.say{background:#fff7e6;border-radius:14px;padding:12px 14px;font-weight:500;border:1px solid #f1dfb5}

/* 아바타 패널 */
#side{position:fixed;right:max(20px,env(safe-area-inset-right));top:calc(var(--safeT) + 90px);bottom:calc(var(--safeB) + 20px);width:420px;z-index:9;display:flex;flex-direction:column;padding:20px 20px 16px}
#side[hidden]{display:none}
#side h2{font-size:calc(22px*var(--fz))}
.tabs{display:flex;gap:6px;margin:12px 0 8px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:calc(14px*var(--fz));font-weight:700;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.opts{flex:1;overflow:auto;padding-right:4px}
.optrow{margin:10px 0}
.optrow .ol{font-size:calc(13px*var(--fz));font-weight:700;color:var(--muted);margin-bottom:6px}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.t{width:auto;height:auto;border-radius:999px;padding:6px 12px;background:#fff;font-size:calc(14px*var(--fz));border:1px solid var(--line);box-shadow:none}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--green)}
.sw button.t[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}

/* 엔딩 */
.issue{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;margin:10px 0}
.issue .k{width:44px;height:44px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:calc(20px*var(--fz))}
.issue h4{margin:0 0 4px;font-size:calc(17px*var(--fz))}
.issue p{margin:4px 0;font-size:calc(15px*var(--fz))}
.issue .why{color:var(--muted)}
.lvl{border-radius:16px;padding:14px 16px;margin:10px 0;background:#fff;border:1px solid var(--line)}
.lvl h4{margin:0;font-size:calc(17px*var(--fz));display:flex;gap:8px;align-items:baseline}
.lvl h4 small{font-weight:500;color:var(--muted);font-size:calc(13px*var(--fz))}
.lvl ul{margin:8px 0 0;padding-left:18px}
.lvl li{margin:6px 0;font-size:calc(15px*var(--fz))}
.lvl .ev{display:block;font-size:calc(12.5px*var(--fz));color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.chips.h{flex-direction:row;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;text-align:left;font-size:calc(15px*var(--fz))}
.chips button[aria-pressed="true"]{border-color:var(--green);background:var(--green-l);font-weight:700}
.qlab{font-weight:700;margin-top:14px}
#shareImg{width:100%;border-radius:16px;margin-top:8px}
.nb-tabs{display:flex;gap:6px;margin:10px 0}
.clue{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;background:#fff}
.clue b{display:block}
.clue .s{font-size:calc(12.5px*var(--fz));color:var(--muted);margin-top:4px}
.reflist{padding-left:22px;font-size:calc(13.5px*var(--fz))}
.reflist li{margin:6px 0}
.reflist li.hl{background:#fff7e6;border-radius:8px}
.map svg{width:100%;height:auto}

#toast{position:fixed;left:50%;top:calc(var(--safeT) + 22px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:calc(15px*var(--fz));opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
#fade{position:fixed;inset:0;background:#f1f2ea;opacity:0;pointer-events:none;transition:opacity .45s;z-index:20}
#fade.on{opacity:1}
#fade.quick{transition:opacity .2s}
#loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(1200px 800px at 50% 40%, var(--bg1), var(--bg2));transition:opacity .6s}
#loading.off{opacity:0;pointer-events:none}
#loading .in{text-align:center}
